<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kontak - Wisata Benteng Pendem Cilacap</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <nav class="navbar">
    <div class="logo">Benteng Pendem</div>
    <div class="menu-toggle" id="menuToggle">
      <span></span><span></span><span></span>
    </div>
    <ul class="nav-links" id="navLinks">
      <li><a href="index.html">Beranda</a></li>
      <li><a href="tentang.html">Tentang</a></li>
      <li><a href="kontak.html" class="active">Kontak</a></li>
    </ul>
  </nav>

  <main class="container">
    <h2 class="section-title">Hubungi Kami</h2>
    <form class="contact-form" id="contactForm">
      <div class="form-group">
        <label for="nama">Nama Lengkap</label>
        <input type="text" id="nama" required placeholder="Masukkan nama Anda">
      </div>
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" required placeholder="Masukkan email Anda">
      </div>
      <div class="form-group">
        <label for="pesan">Pesan</label>
        <textarea id="pesan" rows="4" required placeholder="Tuliskan pesan atau ulasan Anda..."></textarea>
      </div>
      <button type="submit" class="btn-submit">Kirim Pesan</button>
    </form>
  </main>

  <footer>
    <p>&copy; 2026 Wisata Benteng Pendem Cilacap. All Rights Reserved.</p>
  </footer>

  <script src="js/script.js"></script>
</body>
</html>
